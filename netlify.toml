[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20.19.0"

# SPA fallback — every unmatched path serves index.html so client-side
# routes (/auth/callback, /admin/dashboard, etc.) work on direct hit and
# on refresh. Belt-and-braces with public/_redirects.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
